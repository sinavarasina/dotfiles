#================================
# Main
#================================
[main]
font=BlexMono Nerd Font Mono:size=8, Noto Color Emoji:size=8, Noto Sans CJK JP:size=8, MesloLGS Nerd Font Mono:size=8
pad=12x12 

#================================
# Colors (Catpuccin Mocha)
#================================
[colors-dark]
alpha=0.90
background=11111b
foreground=cdd6f4
cursor=11111b cba6f7

## Normal
regular0=45475a  # Surface 1
regular1=f38ba8  # Red
regular2=a6e3a1  # Green
regular3=f9e2af  # Yellow
regular4=89b4fa  # Blue
regular5=cba6f7  # Mauve
regular6=94e2d5  # Teal
regular7=bac2de  # Subtext 1

## Bright
bright0=585b70   # Surface 2
bright1=f38ba8   # Red
bright2=a6e3a1   # Green
bright3=f9e2af   # Yellow
bright4=89b4fa   # Blue
bright5=cba6f7   # Mauve
bright6=94e2d5   # Teal
bright7=a6adc8   # Subtext 0

#================================
# Colors (Catppuccin Latte)
#================================
[colors-light]
alpha=0.90
background=eff1f5
foreground=4c4f69
cursor=eff1f5 8839ef

## Normal
regular0=bcc0cc  # Surface 1
regular1=d20f39  # Red
regular2=40a02b  # Green
regular3=df8e1d  # Yellow
regular4=1e66f5  # Blue
regular5=8839ef  # Mauve
regular6=179299  # Teal
regular7=5c5f77  # Subtext 1

## Bright
bright0=acb0be   # Surface 2
bright1=d20f39   # Red
bright2=40a02b   # Green
bright3=df8e1d   # Yellow
bright4=1e66f5   # Blue
bright5=8839ef   # Mauve
bright6=179299   # Teal
bright7=6c6f85   # Subtext 0

#===============================
# Cursor & URL
#===============================
[cursor]
style=block
blink=yes

#===============================
# Scrollback & Key Bindings
#===============================
[scrollback]
lines=10000

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
