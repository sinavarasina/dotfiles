##################################
###### SINA_VARASINA ENV-VAR #####
##################################

env = EDITOR,nvim 

env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
#env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
#env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = CLUTTER_BACKEND,wayland
#env = SDL_VIDEODRIVER,wayland
#env = SDL_AUDIODRIVER,pipewire


# xwayland apps scale fix (useful if you are use monitor scaling)
env = GDK_SCALE,1 

# firefox
env = MOZ_ENABLE_WAYLAND,1

# electron >28 apps (may help)
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#env = LIBVA_DRIVER_NAME,nvidia 
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = NVD_BACKEND,direct 
#env = GBM_BACKEND,nvidia-drm 
#env = __NV_PRIME_RENDER_OFFLOAD,1 
#env = __VK_LAYER_NV_optimus,NVIDIA_only
#env = WLR_DRM_NO_ATOMIC,1

# FOR VM NVIDIA
#env = LIBGL_ALWAYS_SOFTWARE,1 
#env = WLR_RENDERER_ALLOW_SOFTWARE,1

# nvidia firefox (for hardware acceleration on FF)
#env = MOZ_DISABLE_RDD_SANDBOX,1
#env = EGL_PLATFORM,wayland

# fcitx I/O 
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# Cursor Size
env = XCURSOR_THEME,Hakurei Reimu
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Hakurei Reimu
env = HYPRCURSOR_SIZE,24

# My Preference Terminal Emulator
env = TerminalEmulator,footclient
env = TERMINAL,footclient

# MPD Host & Port Setting
env = MPD_HOST,0.0.0.0
env = MPD_PORT,6600

# MangoHUD enable 
env = MANGOHUD,0
env = MANGOHUD_DLSYM, 0

# ROCM for RX6700XT/gfx1031
env = HSA_OVERRIDE_GFX_VERSION,10.3.0 

# Vulkan
env = AMD_VULKAN_ICD,RADV
env = RADV_PERFTEST,gpl
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi
env = ENABLE_HDR_WSI,1
env = DXVK_HDR,1

# kitty
env = KITTY_ENABLE_WAYLAND,1 

# HDR 
env = ENABLE_HDR_WSI,1
env = DXVK_HDR,1

