##################################
#### SINA_VARASINA WindowRule ####
##################################

windowrule {
    name = global-suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# imv : the image viewer
windowrule {
    name = imv-rules
    match:class = ^(imv)$
    float = on
    size = 900 600
    center = on
    opacity = 1.0 override
}

# firefox pip
windowrule {
    name = firefox-pip
    match:title = ^(Picture-in-Picture)$
    float = on
    # pin = on
    # max_size = 1024 576
    size = 640 360
    # center = on
    opacity = 1.0 override
    move = 6 714
}

# firefox aria2c
windowrule {
    name = firefox-aria2
    match:class = ^firefox$
    match:title = ^Extension: \(Aria2 Integration\) - Download Panel — Mozilla Firefox$
    float = on
    size = 360 305
    center = on
}

# mpv
windowrule {
    name = mpv-rules
    match:class = ^(mpv|com.github.rafostar.Clapper)$
    float = on
    max_size = 1920 1080
    opacity = 1.0 override
}

# fcitx5 RULES
windowrule {
    name = fcitx5-pseudo
    match:class = ^fcitx5$
    pseudo = on
}

# Steam 
windowrule {
    name = steam-popups
    match:class = ^steam.*
    match:title = ^(Steam Settings|Friends List)$
    float = on
}

windowrule {
    name = paradox-launcher
    match:class = ^Paradox Launcher$
    match:title = ^Europa Universalis IV$
    float = on
}

windowrule {
    name = steam-big-picture
    match:title = ^Steam Big Picture Mode$
    workspace = 10
    fullscreen = on
    tile = on
}

# Thunar float
windowrule {
    name = thunar-progress
    match:class = ^(thunar)$
    match:title = ^(File Operation Progress)$
    float = on
    # move = 0% 82%
}

# file roller (archive opener)
windowrule {
    name = file-roller
    match:class = ^(org.gnome.FileRoller)$
    float = on
}

# Qalculate! (QT)
windowrule {
    name = qalculate-qt
    match:class = ^(io.github.Qalculate.qalculate-qt)$
    float = on
    size = 640 360
}

# Qalculate! (GTK)
windowrule {
    name = qalculate-gtk
    match:class = ^(qalculate-gtk)$
    float = on
    size = 640 360
}

# ncmpcpp by keybind
windowrule {
    name = ncmpcpp-keybind
    match:class = ^(ncmpcpp-float-key)$
    float = on
    size = 1120 480
}

# sptlrx by keybind
windowrule {
    name = sptlrx-keybind
    match:class = ^(mpd_lyrics)$
    float = on
    size = 380 1053
    move = 1539 25
}

# alsamixer by keybind
windowrule {
    name = alsamixer-keybind
    match:class = ^(alsamixer-float)$
    float = on
    size = 111 320
    move = 3 29
}

# ani-cli by keybind
windowrule {
    name = ani-cli-keybind
    match:class = ^(ani-cli-float)$
    float = on
    size = 476 155
    move = 728 28
}

# udisktui
windowrule {
    name = udisktui-rules
    match:class = ^(udiskstui)$
    float = on
    size = 1000 300
    center = on
}

# RQuickShare
windowrule {
    name = rquickshare-float
    match:class = ^([Rr]quickshare|R-quick-share)$
    float = on
}

# Telegram media viewer floating
windowrule {
    name = telegram-viewer
    match:class = ^(org.telegram.desktop)$
    match:title = ^(Media viewer)$
    float = on
    max_size = 640 360
}

# GIMP file picker fixed size
windowrule {
    name = gimp-layers
    match:title = ^(Open Image as Layers)$
    size = 800 600
    center = on
}

windowrule {
    name = gimp-open
    match:title = ^(Open Image)$
    size = 800 600
    center = on
}

windowrule {
    name = gimp-export
    match:title = ^(Export Image)$
    size = 800 600
    center = on
}

# USBImager 1.0.10
windowrule {
    name = usbimager-float
    match:class = ^(USBImager 1.0.10)$
    float = on
}

# Zoom
windowrule {
    name = zoom-stayfocused
    match:class = (zoom)
    match:initial_title = (menu window|meeting bottombar popup|sub menu window)
    stay_focused = on
}

windowrule {
    name = zoom-float
    match:class = (zoom)
    match:initial_title = (menu window|Meeting|Meeting chat)
    float = on
}

# Zotero
windowrule {
    name = zotero-float-center
    match:class = ^(Zotero)$
    match:title = ^(Quick Format Citation|Citation Dialog|Citation Picker|Progress)$
    float = on
    center = on
    no_anim = on
}

windowrule {
    name = zotero-maxsize
    match:class = ^(Zotero)$
    match:title = ^(Quick Format Citation|Citation Dialog|Citation Picker)$
    max_size = 800 600
}

# Game Windows Rule
windowrule {
    name = steam-game-mode
    match:class = (steam_app_1446780)
    content = game
    fullscreen_state = 3
}
