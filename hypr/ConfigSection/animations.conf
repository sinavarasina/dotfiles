animations {
    enabled = true
    first_launch_animation = true
    bezier = bouncy, 0.12, 0.8, 0.08, 1.2
    bezier = easeInOut, 0.7, 0, 0.3, 1
    bezier = energetic, 0.2, 1.2, 0, 1

    animation = windows, 1, 4, bouncy, slide
    animation = windowsOut, 1, 4, easeInOut, slidevert
    
    animation = border, 1, 20, easeInOut
    animation = borderangle, 1, 100, easeInOut, loop

    animation = fade, 1, 3, easeInOut
    
    animation = workspaces, 1, 5, energetic, slidefade 50%
    
    animation = layers, 1, 4, bouncy, fade
    animation = specialWorkspace, 1, 3, easeInOut, slidevert
}

